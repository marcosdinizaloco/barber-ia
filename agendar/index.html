<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agendar</title>
<meta name="theme-color" content="#0B0D10">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --noite:#0B0D10; --noite-2:#12161B; --linha:#232A33;
  --giz:#EDEAE4; --giz-2:#A7A39B; --azul:#0097FD; --azul-2:#5CBBFF;
  --ok:#3CCB7F; --erro:#FF7A6B;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--noite)}
body{color:var(--giz);font:16px/1.55 var(--texto);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--azul);outline-offset:3px;border-radius:6px}
.env{max-width:560px;margin:0 auto;padding:0 16px 48px}

.poste{height:10px;background:repeating-linear-gradient(-45deg,#D62828 0 18px,#F4F1EA 18px 36px,#1E5BD8 36px 54px,#F4F1EA 54px 72px);background-size:101.8px 101.8px;animation:gira 1.6s linear infinite}
@keyframes gira{to{background-position:101.8px 0}}

header{padding:26px 0 18px;text-align:center}
.loja{font-family:var(--display);font-weight:900;text-transform:uppercase;
  font-size:clamp(32px,8vw,46px);line-height:.92;letter-spacing:-.4px;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--giz-2);font-size:14.5px;margin:0}

.passo{background:var(--noite-2);border:1px solid var(--linha);border-radius:18px;padding:20px 18px;margin:0 0 14px}
.passo[hidden]{display:none}
.cab{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.cab b{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--azul)}
.cab h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:23px;
  line-height:1;margin:0;letter-spacing:-.2px}

.lista{display:grid;gap:9px}
.opc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#080A0D;border:1px solid var(--linha);border-radius:13px;padding:13px 14px;
  color:var(--giz);font:inherit;transition:border-color .14s,background .14s}
.opc:hover{border-color:var(--azul-2)}
.opc[aria-pressed="true"]{border-color:var(--azul);background:rgba(0,151,253,.1)}
.opc .n{flex:1;min-width:0}
.opc .n b{display:block;font-weight:600;font-size:15.5px}
.opc .n span{color:var(--giz-2);font-size:13px}
.opc .v{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ok);white-space:nowrap}

.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.dia{flex:0 0 auto;cursor:pointer;background:#080A0D;border:1px solid var(--linha);border-radius:13px;
  padding:10px 13px;text-align:center;color:var(--giz);font:inherit;min-width:62px;transition:border-color .14s,background .14s}
.dia[aria-pressed="true"]{border-color:var(--azul);background:rgba(0,151,253,.1)}
.dia s{display:block;text-decoration:none;font-family:var(--mono);font-size:10px;letter-spacing:.9px;
  text-transform:uppercase;color:var(--giz-2)}
.dia b{display:block;font-family:var(--display);font-weight:900;font-size:24px;line-height:1.05}
.dia i{display:block;font-style:normal;font-size:10.5px;color:var(--giz-2);text-transform:uppercase}

.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.hora{cursor:pointer;background:#080A0D;border:1px solid var(--linha);border-radius:11px;padding:12px 6px;
  font-family:var(--mono);font-weight:700;font-size:14.5px;color:var(--giz);transition:border-color .14s,background .14s}
.hora[aria-pressed="true"]{border-color:var(--azul);background:rgba(0,151,253,.12)}
.vazio{color:var(--giz-2);font-size:14px;margin:4px 0 0}

label{display:block;margin:0 0 13px}
label u{display:block;text-decoration:none;font-family:var(--mono);font-size:10.5px;font-weight:700;
  letter-spacing:1.3px;text-transform:uppercase;color:var(--giz-2);margin-bottom:6px}
input{width:100%;background:#080A0D;color:var(--giz);border:1px solid var(--linha);border-radius:12px;
  padding:13px 14px;font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,151,253,.18)}

.resumo{background:#080A0D;border:1px dashed var(--linha);border-radius:13px;padding:13px 14px;margin:0 0 14px;font-size:14.5px}
.resumo div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.resumo span{color:var(--giz-2)}
.resumo b{text-align:right}

button.vai{width:100%;border:2px solid #7CFFB0;border-radius:999px;cursor:pointer;padding:16px;
  font-family:var(--texto);font-weight:800;font-size:16.5px;color:#fff;
  background:linear-gradient(180deg,#2BE06F 0%,#1DB954 100%);
  box-shadow:0 0 26px rgba(37,211,102,.35);transition:filter .14s,transform .14s}
button.vai:hover{filter:brightness(1.07)}
button.vai[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.recado{display:none;margin:0 0 14px;padding:12px 14px;border-radius:12px;font-size:14px;
  border:1px solid var(--erro);color:var(--erro);background:rgba(255,122,107,.08)}
.recado.aparece{display:block}

.feito{text-align:center;padding:6px 0}
.feito .tique{width:62px;height:62px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;
  background:rgba(60,203,127,.13);border:1px solid rgba(60,203,127,.36);font-size:30px;color:var(--ok)}
.feito h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:28px;margin:0 0 8px}
.zap{display:inline-flex;align-items:center;gap:9px;margin-top:18px;text-decoration:none;
  background:linear-gradient(180deg,#2BE06F,#1DB954);color:#fff;font-weight:700;
  border-radius:999px;padding:13px 22px;font-size:15px}

.carregando{text-align:center;color:var(--giz-2);padding:50px 0;font-size:14.5px}
footer{text-align:center;padding:26px 0 0;color:var(--giz-2);font-size:12px}
footer img{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:7px}
footer b{color:var(--giz)}
footer b i{font-style:normal;color:var(--azul)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="poste"></div>

<div class="env">
  <div id="carregando" class="carregando">Carregando…</div>

  <div id="tudo" hidden>
    <header>
      <h1 class="loja" id="nome-loja">Barbearia</h1>
      <p class="sub">Escolha o serviço, o profissional e o horário.</p>
    </header>

    <div class="recado" id="recado" role="alert"></div>

    <section class="passo" id="p-servico">
      <div class="cab"><b>1</b><h2>Serviço</h2></div>
      <div class="lista" id="lista-servicos"></div>
    </section>

    <section class="passo" id="p-prof" hidden>
      <div class="cab"><b>2</b><h2>Profissional</h2></div>
      <div class="lista" id="lista-prof"></div>
    </section>

    <section class="passo" id="p-dia" hidden>
      <div class="cab"><b>3</b><h2>Dia e horário</h2></div>
      <div class="dias" id="lista-dias"></div>
      <div class="horas" id="lista-horas"></div>
      <p class="vazio" id="sem-hora" hidden>Nenhum horário livre neste dia.</p>
    </section>

    <section class="passo" id="p-voce" hidden>
      <div class="cab"><b>4</b><h2>Seus dados</h2></div>
      <div class="resumo" id="resumo"></div>
      <label><u>Seu nome</u><input id="f-nome" autocomplete="name" maxlength="60"></label>
      <label><u>Seu WhatsApp</u><input id="f-tel" type="tel" inputmode="numeric"
             autocomplete="tel-national" placeholder="(79) 99999-9999"></label>
      <button class="vai" id="confirmar">CONFIRMAR AGENDAMENTO</button>
    </section>

    <section class="passo feito" id="p-feito" hidden>
      <div class="tique">&#10003;</div>
      <h2>Agendado</h2>
      <div class="resumo" id="resumo-final"></div>
      <a class="zap" id="link-zap" href="#" target="_blank" rel="noopener" hidden>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.3.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.1.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.5.2.5.3.1.1.1.7-.1 1.3Z"/></svg>
        Falar com a barbearia
      </a>
    </section>

    <footer>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwjH7c69qlBz58Cuy0c23Yq7kSC-4PpohEqQCpKUy4gAb6Q1Syzqp-hxVra00wRr7RhiQ/exec';
var $ = function(s){ return document.querySelector(s); };
var SLUG = (new URLSearchParams(location.search)).get('b') || '';
SLUG = SLUG.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 60);

var loja = { nome:'', whatsapp:'' };
var esc = { servico:null, prof:null, dia:null, hora:null };
var disp = null;

function pega(acao, extra){
  return fetch(API + '?action=' + acao + '&b=' + encodeURIComponent(SLUG) + (extra || ''),
               { cache:'no-store' }).then(function(r){ return r.json(); });
}
function falar(txt){ var e = $('#recado'); e.textContent = txt; e.classList.add('aparece'); }
function calar(){ $('#recado').classList.remove('aparece'); }
function moeda(v){ return 'R$ ' + (Number(v)||0).toFixed(2).replace('.', ','); }

function morrer(titulo, texto){
  $('#carregando').innerHTML =
      '<h1 class="loja" style="margin-bottom:10px">' + titulo + '</h1>'
    + '<p class="sub">' + texto + '</p>';
}

if (!SLUG){
  morrer('Endereço incompleto', 'Peça o link de agendamento para a barbearia.');
} else {
  Promise.all([ pega('nome'), pega('servicos'), pega('barbeiros') ])
    .then(function(r){
      var n = r[0], sv = r[1], bb = r[2];
      if (!n || !n.ok){
        morrer('Barbearia não encontrada', 'Confira o link com quem te mandou.');
        return;
      }
      loja.nome = n.nome; loja.whatsapp = String(n.whatsapp || '');
      document.title = 'Agendar — ' + loja.nome;
      $('#nome-loja').textContent = loja.nome;

      var servicos  = (sv && sv.dados) || [];
      var barbeiros = (bb && bb.dados) || [];
      if (!servicos.length){
        morrer(loja.nome, 'Esta barbearia ainda não cadastrou os serviços dela.');
        return;
      }

      montarServicos(servicos);
      montarProf(barbeiros);
      $('#carregando').hidden = true;
      $('#tudo').hidden = false;
    })
    .catch(function(){
      morrer('Não consegui carregar', 'Tente de novo daqui a pouco.');
    });
}

function botao(classe, dentro, aoClicar){
  var b = document.createElement('button');
  b.type = 'button'; b.className = classe; b.innerHTML = dentro;
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', function(){
    var irmaos = b.parentNode.querySelectorAll('[aria-pressed]');
    for (var i = 0; i < irmaos.length; i++) irmaos[i].setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-pressed', 'true');
    aoClicar();
  });
  return b;
}
function txt(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function montarServicos(lista){
  var alvo = $('#lista-servicos'); alvo.innerHTML = '';
  lista.forEach(function(s){
    alvo.appendChild(botao('opc',
      '<span class="n"><b>' + txt(s.nome) + '</b><span>' + (Number(s.duracao)||30) + ' min</span></span>'
      + '<span class="v">' + moeda(s.preco) + '</span>',
      function(){ esc.servico = s; esc.dia = null; esc.hora = null;
                  $('#p-prof').hidden = false; passoDia(); }));
  });
}

function montarProf(lista){
  var alvo = $('#lista-prof'); alvo.innerHTML = '';
  var opcoes = lista.slice();
  opcoes.unshift({ id:'', nome:'Tanto faz', _qualquer:true });
  opcoes.forEach(function(p){
    alvo.appendChild(botao('opc',
      '<span class="n"><b>' + txt(p.nome) + '</b>'
      + (p._qualquer ? '<span>quem estiver livre</span>' : '') + '</span>',
      function(){ esc.prof = p._qualquer ? null : p; esc.dia = null; esc.hora = null; passoDia(); }));
  });
}

function passoDia(){
  if (!esc.servico) return;
  $('#p-dia').hidden = false;
  $('#lista-dias').innerHTML = '<p class="vazio">Procurando horários…</p>';
  $('#lista-horas').innerHTML = ''; $('#sem-hora').hidden = true; $('#p-voce').hidden = true;

  pega('disponibilidade', '&dur=' + (Number(esc.servico.duracao) || 30)
       + (esc.prof ? '&barbeiro=' + encodeURIComponent(esc.prof.nome) : ''))
    .then(function(r){
      disp = (r && r.dados) || null;
      if (!disp || !disp.dias || !disp.dias.length){
        $('#lista-dias').innerHTML = '<p class="vazio">Esta barbearia ainda não definiu os horários dela.</p>';
        return;
      }
      var alvo = $('#lista-dias'); alvo.innerHTML = '';
      disp.dias.forEach(function(d, i){
        var b = botao('dia',
          '<s>' + txt(d.semana) + '</s><b>' + d.dia + '</b><i>' + txt(d.mes) + '</i>',
          function(){ esc.dia = d; esc.hora = null; montarHoras(); });
        alvo.appendChild(b);
        if (i === 0){ esc.dia = d; b.setAttribute('aria-pressed','true'); }
      });
      montarHoras();
    })
    .catch(function(){ $('#lista-dias').innerHTML = '<p class="vazio">Não consegui ver a agenda agora.</p>'; });
}

function montarHoras(){
  var alvo = $('#lista-horas'); alvo.innerHTML = ''; $('#p-voce').hidden = true;
  if (!disp || !esc.dia) return;
  var ocup = (disp.ocupados && disp.ocupados[esc.dia.data]) || {};
  var livres = (disp.slotsPadrao || []).filter(function(h){
    if (ocup[h]) return false;
    if (esc.dia.data === disp.hoje && disp.agora && h <= disp.agora) return false;
    return true;
  });
  $('#sem-hora').hidden = livres.length > 0;
  livres.forEach(function(h){
    alvo.appendChild(botao('hora', h, function(){ esc.hora = h; passoVoce(); }));
  });
}

function passoVoce(){
  $('#p-voce').hidden = false;
  $('#resumo').innerHTML =
      '<div><span>Serviço</span><b>' + txt(esc.servico.nome) + '</b></div>'
    + '<div><span>Profissional</span><b>' + txt(esc.prof ? esc.prof.nome : 'quem estiver livre') + '</b></div>'
    + '<div><span>Quando</span><b>' + txt(esc.dia.label) + ' às ' + txt(esc.hora) + '</b></div>'
    + '<div><span>Valor</span><b>' + moeda(esc.servico.preco) + '</b></div>';
  try { $('#p-voce').scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){}
}

$('#f-tel').addEventListener('input', function(){
  var d = this.value.replace(/\D/g,'').slice(0,11), s = '';
  if (d.length)      s = '(' + d.slice(0,2);
  if (d.length >= 3) s += ') ' + d.slice(2, d.length > 10 ? 7 : 6);
  if (d.length >= 7) s += '-' + d.slice(d.length > 10 ? 7 : 6);
  this.value = s;
});

$('#confirmar').addEventListener('click', function(){
  calar();
  var nome = $('#f-nome').value.trim();
  var tel  = $('#f-tel').value.replace(/\D/g,'');
  if (nome.length < 2) return falar('Escreva o seu nome.');
  if (tel.length < 10) return falar('Confira o WhatsApp — precisa ter DDD.');
  if (!esc.servico || !esc.dia || !esc.hora) return falar('Escolha o serviço, o dia e o horário.');

  var b = this; b.disabled = true; b.textContent = 'AGENDANDO…';
  fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'agendar', b:SLUG,
      data: esc.dia.data, horario: esc.hora, cliente: nome, telefone: tel,
      servico: esc.servico.nome, barbeiro: esc.prof ? esc.prof.nome : '',
      valor: Number(esc.servico.preco) || 0 }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      b.disabled = false; b.textContent = 'CONFIRMAR AGENDAMENTO';
      if (!r || !r.ok) return falar('Não consegui agendar. Tente outro horário.');
      ['#p-servico','#p-prof','#p-dia','#p-voce'].forEach(function(id){ $(id).hidden = true; });
      $('#resumo-final').innerHTML = $('#resumo').innerHTML
        + '<div><span>Em nome de</span><b>' + txt(nome) + '</b></div>';
      if (loja.whatsapp){
        var z = $('#link-zap');
        z.href = 'https://wa.me/' + loja.whatsapp
               + '?text=' + encodeURIComponent('Oi! Acabei de agendar ' + esc.servico.nome
                 + ' para ' + esc.dia.label + ' as ' + esc.hora + '.');
        z.hidden = false;
      }
      $('#p-feito').hidden = false;
      try { $('#p-feito').scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){}
    })
    .catch(function(){
      b.disabled = false; b.textContent = 'CONFIRMAR AGENDAMENTO';
      falar('Não consegui falar com a agenda. Tente de novo.');
    });
});
</script>
