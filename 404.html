<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Barber IA Pro</title>
<!--
  ROTA CURTA DO PAINEL  —  barber-ia.pro/p/<slug>

  O GitHub Pages serve ESTE arquivo para qualquer caminho que nao existe
  no repositorio. E so o que ele faz de diferente: antes mostrava a
  pagina de erro padrao do GitHub, agora mostra esta.

  Nenhuma pasta publicada mudou. Os 90 aplicativos sao pastas de
  verdade, servidas normalmente, e nunca passam por aqui.

  CUIDADO QUE VALE REGISTRAR: o GitHub Pages devolve este arquivo com
  status HTTP 404, e nao 200. Isso e proposital e e o que mantem a
  checagem de slug do cadastro funcionando — ela pergunta ao
  barber-ia.pro se /<slug>/ existe e so considera ocupado quando vem
  200. Se um dia alguem fizer esta pagina responder 200, o cadastro
  passa a achar que TODO slug esta ocupado e para de criar conta.
-->
<style>
  :root{--noite:#0B0D10;--giz:#EDEAE4;--giz-2:#A7A39B;--azul:#0097FD;--linha:#232A33}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--noite);color:var(--giz);
    font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
  .meio{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  h1{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;
     text-transform:uppercase;font-size:clamp(30px,7vw,46px);line-height:.92;margin:0 0 10px}
  h1 em{font-style:normal;color:var(--azul)}
  p{color:var(--giz-2);margin:0 0 22px;max-width:40ch}
  a.bt{display:inline-block;text-decoration:none;background:var(--azul);color:#021221;
    border-radius:999px;padding:14px 26px;font-weight:700}
  .carregando{color:var(--giz-2);font-size:14px}
</style>
</head>
<body>
<div class="meio">
  <div id="caixa">
    <p class="carregando">Abrindo…</p>
  </div>
</div>

<script>
/* O mesmo /exec publico que os aplicativos ja chamam. Nao e segredo. */
var API = 'https://script.google.com/macros/s/AKfycbwjH7c69qlBz58Cuy0c23Yq7kSC-4PpohEqQCpKUy4gAb6Q1Syzqp-hxVra00wRr7RhiQ/exec';

(function(){
  var caminho = location.pathname.replace(/^\/+|\/+$/g, '');   // tira as barras das pontas
  var partes  = caminho.split('/');

  /* /p/<slug>  ->  o painel daquela barbearia */
  if (partes.length === 2 && partes[0].toLowerCase() === 'p' && partes[1]){
    /* decodifica ANTES de limpar: sem isso um %20 vira "20" e o slug sai
       errado em vez de sair limpo. */
    var cru = partes[1];
    try { cru = decodeURIComponent(cru); } catch(e){}
    var slug = cru.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 60);
    if (slug){
      /* O painel escreve a saudacao a partir de ?nome=. O link curto nao
         tem como carregar o nome dentro dele, entao perguntamos aqui,
         rapido, e seguimos de qualquer jeito.

         FALHA ABERTA, de proposito: se a API demorar, cair ou nao
         conhecer o slug, o painel abre mesmo assim — so com o nome
         feinho que ele ja mostrava. Painel que abre torto e melhor que
         painel que nao abre. */
      var extra = location.search ? '&' + location.search.slice(1) : '';
      var ir = function(nome){
        location.replace('/painel-app-pwa/?b=' + encodeURIComponent(slug)
          + (nome ? '&nome=' + encodeURIComponent(nome) : '') + extra);
      };

      var pronto = false;
      var seguir = function(nome){ if (!pronto){ pronto = true; ir(nome); } };
      setTimeout(function(){ seguir(''); }, 1500);      // teto: 1,5 s e vai

      try {
        fetch(API + '?action=nome&b=' + encodeURIComponent(slug), { cache:'no-store' })
          .then(function(r){ return r.json(); })
          .then(function(j){ seguir(j && j.ok ? j.nome : ''); })
          .catch(function(){ seguir(''); });
      } catch(e){ seguir(''); }
      return;
    }
  }

  /* /ag/<slug>  ->  a pagina publica de agendamento daquela barbearia.

     Nao existe pasta "ag" no repositorio, entao TODO /ag/... cai aqui.
     Os 90 aplicativos do Metodo A moram em pastas de verdade na raiz
     (/<slug>/) e sao servidos direto pelo GitHub Pages — eles nunca
     passam por este arquivo.

     Nao conferimos aqui se o slug existe: a propria pagina de
     agendamento precisa falar com a API de qualquer jeito, e e ela
     quem diz "barbearia nao encontrada". Uma requisicao em vez de
     duas, e a pessoa ve a resposta certa em vez de um 404 generico. */
  if (partes.length === 2 && partes[0].toLowerCase() === 'ag' && partes[1]){
    var cruA = partes[1];
    try { cruA = decodeURIComponent(cruA); } catch(e){}
    var slugA = cruA.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 60);
    if (slugA){
      location.replace('/agendar/?b=' + encodeURIComponent(slugA)
                       + (location.search ? '&' + location.search.slice(1) : ''));
      return;
    }
  }

  /* qualquer outro endereco errado: pagina honesta, sem redirecionar
     ninguem para lugar nenhum. */
  document.getElementById('caixa').innerHTML =
      '<h1>Esse endereço <em>não existe</em>.</h1>'
    + '<p>O link pode ter sido digitado errado ou ter mudado.</p>'
    + '<a class="bt" href="/">Ir para o início</a>';
})();
</script>
</body>
</html>
